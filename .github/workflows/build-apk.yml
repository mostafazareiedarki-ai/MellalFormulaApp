name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Remove any previous Android project (keeps this step repeatable)
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Generate native app icons from resources/icon.png
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#0d1b2e' --iconBackgroundColorDark '#0d1b2e'

      - name: Sync web assets and plugins into Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mellal-chem-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
