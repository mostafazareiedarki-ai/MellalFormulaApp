name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Remove any previous Android project (keeps this step repeatable)
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Generate native app icons from resources/icon.png
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#0d1b2e' --iconBackgroundColorDark '#0d1b2e'

      - name: Sync web assets and plugins into Android project
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mellal-chem-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build unsigned release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload unsigned release APK artifact (always available)
        uses: actions/upload-artifact@v4
        with:
          name: mellal-chem-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Check whether signing secrets are configured
        id: checksecret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret: FOUND"
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "KEYSTORE_BASE64 secret: NOT FOUND — signing step will be skipped. Add it in Settings > Secrets and variables > Actions."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign release APK
        if: steps.checksecret.outputs.has_secret == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n1)
          "${BUILD_TOOLS}apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          rm release.keystore

      - name: Upload signed release APK artifact
        if: steps.checksecret.outputs.has_secret == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mellal-chem-release-signed-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
